name: Adalat-AI CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flake8 black isort
      - run: black --check --diff src/ || true
      - run: flake8 src/ --max-line-length=120 --ignore=E501,W503 || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - run: pip install pytest pytest-cov pydantic python-dotenv
      - run: pytest tests/ -v --tb=short || true

  ingest:
    name: Auto Ingest New PDFs
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for new PDFs
        id: check_pdfs
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "data/raw/.*\.pdf"; then
            echo "new_pdfs=true" >> $GITHUB_OUTPUT
          else
            echo "new_pdfs=false" >> $GITHUB_OUTPUT
          fi
      - name: Run ingestion if new PDFs
        if: steps.check_pdfs.outputs.new_pdfs == 'true'
        run: |
          pip install -r requirements.docker.txt
          python scripts/ingest_documents.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f docker/Dockerfile.api -t adalat-ai-api:test .
      - run: docker build -f docker/Dockerfile.ui -t adalat-ai-ui:test .