[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "tesseract", "poppler_utils"]

[phases.install]
cmds = [
  "python3.12 -m pip install --upgrade pip",
  "python3.12 -m pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu",
  "python3.12 -m pip install numpy==1.26.4",
  "python3.12 -m pip install -r requirements.docker.txt"
]

[start]
cmd = "python3.12 run.py"