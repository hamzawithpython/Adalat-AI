[phases.setup]
nixPkgs = ["python312", "tesseract", "poppler_utils"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu",
  "pip install numpy==1.26.4",
  "pip install -r requirements.docker.txt"
]

[start]
cmd = "python run.py"